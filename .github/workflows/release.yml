name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

env:
  NDK_VERSION: "28.2.13676358"
  CMAKE_VERSION: "3.22.1"

permissions:
  contents: write

jobs:
  test:
    name: Test before release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - run: flutter test

      - working-directory: example
        run: flutter pub get
      - working-directory: example
        run: flutter test

  build-and-release:
    name: Build & publish zipped release
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Android NDK & CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}" > /dev/null

      - run: flutter pub get

      - name: Install example app dependencies
        working-directory: example
        run: flutter pub get

      - name: Build release APK (arm64-v8a + armeabi-v7a)
        working-directory: example
        run: flutter build apk --release

      - name: Package zipped build
        id: package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APK_SRC="example/build/app/outputs/flutter-apk/app-release.apk"
          APK_PATH="dist/widget_rtlsdr-example-${VERSION}.apk"

          STAGE_DIR="dist/widget_rtlsdr-${VERSION}-android"
          mkdir -p "$STAGE_DIR"
          cp "$APK_SRC" "$APK_PATH"
          cp "$APK_SRC" "$STAGE_DIR/widget_rtlsdr-example-${VERSION}.apk"
          cp README.md CHANGELOG.md LICENSE "$STAGE_DIR/"
          ZIP_PATH="dist/widget_rtlsdr-${VERSION}-android.zip"
          (cd dist && zip -r "$(basename "$ZIP_PATH")" "$(basename "$STAGE_DIR")")

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "zip_path=$ZIP_PATH" >> "$GITHUB_OUTPUT"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: widget_rtlsdr ${{ steps.package.outputs.version }}
          # Both the raw APK (install it directly) and the zip (APK +
          # README/CHANGELOG/LICENSE bundled) are attached — the zip alone
          # made the APK invisible as its own downloadable asset.
          files: |
            ${{ steps.package.outputs.apk_path }}
            ${{ steps.package.outputs.zip_path }}
          generate_release_notes: true

  # Publishing to pub.dev is handled by publish.yml (dart-lang/setup-dart's
  # own reusable OIDC-publish workflow), triggered by the same tag push.
