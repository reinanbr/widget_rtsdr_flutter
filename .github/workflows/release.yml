name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

env:
  NDK_VERSION: "28.2.13676358"
  CMAKE_VERSION: "3.22.1"

permissions:
  contents: write

jobs:
  test:
    name: Test before release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - run: flutter test

      - working-directory: example
        run: flutter pub get
      - working-directory: example
        run: flutter test

  build-and-release:
    name: Build & publish zipped release
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Android NDK & CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}" > /dev/null

      - run: flutter pub get

      - name: Install example app dependencies
        working-directory: example
        run: flutter pub get

      - name: Build release APK (arm64-v8a + armeabi-v7a)
        working-directory: example
        run: flutter build apk --release

      - name: Package zipped build
        id: package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APK_SRC="example/build/app/outputs/flutter-apk/app-release.apk"
          APK_PATH="dist/widget_rtlsdr-example-${VERSION}.apk"

          STAGE_DIR="dist/widget_rtlsdr-${VERSION}-android"
          mkdir -p "$STAGE_DIR"
          cp "$APK_SRC" "$APK_PATH"
          cp "$APK_SRC" "$STAGE_DIR/widget_rtlsdr-example-${VERSION}.apk"
          cp README.md CHANGELOG.md LICENSE "$STAGE_DIR/"
          ZIP_PATH="dist/widget_rtlsdr-${VERSION}-android.zip"
          (cd dist && zip -r "$(basename "$ZIP_PATH")" "$(basename "$STAGE_DIR")")

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "zip_path=$ZIP_PATH" >> "$GITHUB_OUTPUT"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: widget_rtlsdr ${{ steps.package.outputs.version }}
          # Both the raw APK (install it directly) and the zip (APK +
          # README/CHANGELOG/LICENSE bundled) are attached — the zip alone
          # made the APK invisible as its own downloadable asset.
          files: |
            ${{ steps.package.outputs.apk_path }}
            ${{ steps.package.outputs.zip_path }}
          generate_release_notes: true

  # ---------------------------------------------------------------------------
  # Publish to pub.dev once tests and the example app build have both passed.
  #
  # Uses pub.dev's "Automated publishing" (GitHub Actions OIDC) — no secrets
  # stored in this repo. This only works once, on pub.dev, you:
  #   1. Have published this package manually at least once (claims the name
  #      under your account — `flutter pub publish` from a local machine).
  #   2. On the package's pub.dev page -> Admin tab -> Automated publishing,
  #      enable GitHub Actions publishing for repository
  #      "reinanbr/widget_rtsdr_flutter", workflow file "release.yml", and
  #      (recommended) require the tag pattern "v{{version}}".
  # Until that's configured, this job will fail at the `pub publish` step
  # with an authentication error — the rest of the release is unaffected.
  # ---------------------------------------------------------------------------
  publish-pub-dev:
    name: Publish to pub.dev
    needs: build-and-release
    if: github.repository == 'reinanbr/widget_rtsdr_flutter'
    runs-on: ubuntu-latest
    # Without this, an unconfigured trusted-publishing setup doesn't
    # necessarily fail fast (observed hanging indefinitely on `flutter pub
    # publish` in driver_rtlsdr's own CI instead of erroring out) - bound
    # it so a misconfiguration costs minutes, not hours.
    timeout-minutes: 5
    permissions:
      id-token: write # required for pub.dev's OIDC trusted publishing
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify pubspec.yaml version matches the pushed tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PUBSPEC_VERSION="$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}')"
          if [ "$TAG_VERSION" != "$PUBSPEC_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match pubspec.yaml version $PUBSPEC_VERSION - bump pubspec.yaml before tagging."
            exit 1
          fi

      - run: flutter pub get

      - name: Publish to pub.dev
        run: flutter pub publish --force
